name: Build viogpu3d Driver

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      mesa_branch:
        description: 'Mesa commit to build'
        required: false
        default: '7ad10727e0c547cbd7b1b587700346bdfdc74d8a'
      driver_branch:
        description: 'KVM guest drivers commit'
        required: false
        default: '13d74bb75df0a09bd01307b32b0ee0396cdd3279'

env:
  MESA_REPO: https://github.com/AlanoSong/virtio-win-mesa
  MESA_BRANCH: ${{ github.event.inputs.mesa_branch || '7ad10727e0c547cbd7b1b587700346bdfdc74d8a' }}
  DRIVER_REPO: https://github.com/AlanoSong/kvm-guest-drivers-windows
  DRIVER_BRANCH: ${{ github.event.inputs.driver_branch || '13d74bb75df0a09bd01307b32b0ee0396cdd3279' }}

jobs:
  build:
    runs-on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Spectre-mitigated libs
        shell: pwsh
        run: |
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe"
          if (Test-Path $installer) {
            & $installer modify `
              --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" `
              --add Microsoft.VisualStudio.Component.VC.Runtimes.ARM64.Spectre `
              --quiet --norestart --force
            Start-Sleep -Seconds 5
          }

      - name: Install Meson and Ninja
        run: |
          pip install meson ninja mako pyyaml

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Install winflexbison
        run: |
          choco install winflexbison3 -y
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      - name: Install Windows Driver Kit (WDK)
        run: |
          choco install windowsdriverkit10 -y

      - name: Find Windows SDK headers
        run: |
          $sdkInclude = "C:\Program Files (x86)\Windows Kits\10\Include"
          $sdkVersions = Get-ChildItem $sdkInclude -Directory | Sort-Object Name -Descending

          foreach ($ver in $sdkVersions) {
            $umPath = Join-Path $ver.FullName "um"
            $sharedPath = Join-Path $ver.FullName "shared"
            $d3d10Header = Join-Path $umPath "d3d10umddi.h"
            $d3dkmHeader = Join-Path $sharedPath "d3dkmddi.h"

            if ((Test-Path $d3d10Header) -and (Test-Path $d3dkmHeader)) {
              echo "Found d3d10umddi.h in: $umPath"
              echo "Found d3dkmddi.h in: $sharedPath"
              echo "WDK_INCLUDE=$umPath;$sharedPath" >> $env:GITHUB_ENV
              exit 0
            }
          }

          echo "ERROR: Could not find required headers"
          exit 1

      - name: Create working directories
        run: |
          mkdir mesa_prefix
          mkdir build_output
          echo "MESA_PREFIX=${{ github.workspace }}\mesa_prefix" >> $env:GITHUB_ENV

      # Part 2: Build Mesa
      - name: Clone Mesa source
        run: |
          git clone ${{ env.MESA_REPO }} mesa
          cd mesa
          git checkout ${{ env.MESA_BRANCH }}
          git submodule update --init --recursive
          cd ..

      - name: Remove broken winstub include
        shell: pwsh
        run: |
          $target = "${{ github.workspace }}\mesa\src\util\format\u_format.h"
          if (Test-Path $target) {
            (Get-Content $target) -replace '#include\s+"win-stub\.h"', '// #include "win-stub.h"' | Set-Content $target
          }

      - name: Configure Mesa build
        working-directory: mesa
        env:
          INCLUDE: ${{ env.WDK_INCLUDE }};${{ env.INCLUDE }}
        run: |
          mkdir build
          cd build

          echo "INCLUDE paths: $env:INCLUDE"

          meson setup .. --prefix=$env:MESA_PREFIX `
            -Dgallium-drivers=virgl `
            -Dgallium-d3d10umd=true `
            -Dgallium-wgl-dll-name=viogpu_wgl `
            -Dgallium-d3d10-dll-name=viogpu_d3d10 `
            -Db_vscrt=mt

      - name: Build and install Mesa
        working-directory: mesa/build
        env:
          INCLUDE: ${{ env.WDK_INCLUDE }};${{ env.INCLUDE }}
        run: |
          ninja install

      - name: Fix Mesa DLL names
        run: |
          $binPath = "$env:MESA_PREFIX\bin"
          if (-not (Test-Path "$binPath\z.dll")) {
            $zDll = Get-ChildItem "$binPath\z-*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($zDll) {
              Copy-Item $zDll.FullName "$binPath\z.dll"
              Write-Host "Copied $($zDll.Name) to z.dll"
            }
          }

      # Part 3: Build Driver
      - name: Clone KVM guest drivers
        run: |
          git clone ${{ env.DRIVER_REPO }} kvm-guest-drivers-windows
          cd kvm-guest-drivers-windows
          git checkout ${{ env.DRIVER_BRANCH }}
          git submodule update --init --recursive
          cd ..

      - name: Configure Driver Build Props and Stub Logging
        shell: pwsh
        run: |
          # 1. Create clean stub header
          $fixHeader = @'
#pragma once
#include <ntddk.h>

#ifdef DbgPrint
#undef DbgPrint
#endif
#define DbgPrint(...) ((ULONG)0)

#ifdef DbgPrintEx
#undef DbgPrintEx
#endif
#define DbgPrintEx(...) ((ULONG)0)
'@
          Set-Content -Path "kvm-guest-drivers-windows\viogpu\dbgfix.h" -Value $fixHeader -Encoding utf8

          # 2. Inject props using single-quoted here-string (avoids PowerShell subexpression expansion)
          $propsContent = @'
<Project>
  <PropertyGroup>
    <MESA_PREFIX_ARM64>__MESA_PREFIX_PLACEHOLDER__</MESA_PREFIX_ARM64>
  </PropertyGroup>
  <ItemDefinitionGroup>
    <ClCompile>
      <SpectreMitigation>false</SpectreMitigation>
      <TreatWarningAsError>false</TreatWarningAsError>
      <DisableSpecificWarnings>4100;%(DisableSpecificWarnings)</DisableSpecificWarnings>
      <ForcedIncludeFiles>$(MSBuildThisFileDirectory)dbgfix.h;%(ForcedIncludeFiles)</ForcedIncludeFiles>
    </ClCompile>
  </ItemDefinitionGroup>
</Project>
'@
          $propsContent = $propsContent.Replace("__MESA_PREFIX_PLACEHOLDER__", "${{ env.MESA_PREFIX }}")
          Set-Content -Path "kvm-guest-drivers-windows\viogpu\Directory.Build.props" -Value $propsContent -Encoding utf8

      - name: Patch driver source
        run: |
          if (Test-Path ".\scripts\patch-driver.ps1") {
            .\scripts\patch-driver.ps1 -DriverPath kvm-guest-drivers-windows
          }

      - name: Build viogpu driver
        working-directory: kvm-guest-drivers-windows/viogpu
        env:
          MESA_PREFIX_ARM64: ${{ env.MESA_PREFIX }}
        run: |
          ..\build\build.bat viogpu.sln Win10 ARM64

      - name: Sign driver files
        working-directory: kvm-guest-drivers-windows/viogpu
        shell: cmd
        run: |
          ..\build\signAll.bat
          copy ..\build\VirtIOTestCert.* .
          copy ..\build\VirtIOTestCert.* build_output\
          copy ..\build\VirtIOTestCert.* kvm-guest-drivers-windows\viogpu\

      - name: Collect build artifacts
        run: |
          Copy-Item -Path "$env:MESA_PREFIX\bin\*.dll" -Destination "build_output\" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$env:MESA_PREFIX\lib\*.dll" -Destination "build_output\" -Force -ErrorAction SilentlyContinue

          $driverPaths = @(
            "kvm-guest-drivers-windows\viogpu\viogpu3d\x64",
            "kvm-guest-drivers-windows\viogpu\viogpu3d\Win10Release",
            "kvm-guest-drivers-windows\viogpu\viogpu3d\Win11Release",
            "kvm-guest-drivers-windows\viogpu\viogpudo\objfre_win10_arm64\arm64",
            "kvm-guest-drivers-windows\Build"
          )

          foreach ($path in$driverPaths) {
            if (Test-Path $path) {
              Copy-Item -Path "$path\*" -Destination "build_output\" -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          Write-Host "=== Collected build artifacts ==="
          Get-ChildItem -Path "build_output" -Recurse | Format-Table Name, Length, Directory

      - name: Upload Mesa artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesa-dlls
          path: |
            ${{ env.MESA_PREFIX }}/bin/*.dll
            ${{ env.MESA_PREFIX }}/lib/*.dll
          if-no-files-found: warn

      - name: Upload driver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: viogpu3d-driver
          path: build_output/
          if-no-files-found: warn

      - name: Upload full build output
        uses: actions/upload-artifact@v4
        with:
          name: full-build
          path: |
            kvm-guest-drivers-windows/viogpu/
          if-no-files-found: warn
